global:
  sendAnonymousUsage: true

# log:
#   level: INFO # [DEBUG, INFO, WARNING, ERROR, CRITICAL]
#   format: common # [common, json, logfmt]
#   filePath: /log/traefik.log

# access log to stdout, read by crowdsec through the docker socket (parser crowdsecurity/traefik)
accessLog:
  format: json
  fields:
    headers:
      names:
        User-Agent: keep

# CrowdSec bouncer plugin, the middleware is traefik/crowdsec.yml; without the plugin every site
# would run unprotected, so traefik refuses to start when the download fails (needs internet at start)
experimental:
  abortOnPluginFailure: true
  plugins:
    bouncer:
      moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      version: v1.8.1

api:
  dashboard: true
  insecure: false

# -- Change EntryPoints here...
entryPoints:
  web:
    address: :80
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: :443
    http: # set default tls settings
      middlewares:
        - crowdsec@file # every https router passes the CrowdSec bouncer
      tls:
        certResolver: staging # change to production after verifying your configuration
        domains:
          - main: DOMAIN
            sans:
              - '*.DOMAIN'

  metrics: # for prometheus metrics
    address: :8899

certificatesResolvers:
  staging:
    acme:
      email: EMAIL
      storage: /certs/acme-staging.json
      caServer: "https://acme-staging-v02.api.letsencrypt.org/directory"
      dnsChallenge:
        provider: hetzner
  production:
    acme:
      email: EMAIL
      storage: /certs/acme-production.json
      caServer: "https://acme-v02.api.letsencrypt.org/directory"
      dnsChallenge:
        provider: hetzner

# -- (Optional) Disable TLS Cert verification check
serversTransport:
  insecureSkipVerify: true

providers:
  docker:
    network: traefik
    exposedByDefault: false
    # tls:
    #   insecureSkipVerify: true
  file:
    directory: /etc/traefik/conf
    watch: true

#! PROMETHEUS
metrics:
  prometheus:
    entryPoint: 'metrics'
    addEntryPointsLabels: true
    addServicesLabels: true
    buckets:
      - 0.100000
      - 0.300000
      - 1.200000
      - 5.000000
